[project]
name = "contextual-chatbot-proxy"
version = "0.1.0"
description = "Backend proxy for the BigBlueButton contextual-chatbot plugin. Keeps the DeepSeek API key server-side and answers student questions using the lesson context (transcript, chat, slides, teacher materials)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
